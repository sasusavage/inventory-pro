<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – InventoryPro</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <span class="login-logo">📦</span>
                <h1 class="login-title">Welcome Back</h1>
                <p style="color:var(--text-secondary); font-size:0.9rem;">Sign in to your account</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" class="form-control" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="margin-top:0.75rem; padding:0.75rem;">
                    Sign In
                </button>
            </form>

            <div id="error-msg" style="color:#dc2626; margin-top:0.9rem; text-align:center;
                                       font-size:0.88rem; display:none;"></div>

            <div style="text-align:center; margin-top:1.25rem; font-size:0.85rem; color:#94a3b8;">
                Don't have an account?
                <a href="/signup" style="color:#6366f1; font-weight:600;">Create your store →</a>
            </div>
            <div style="text-align:center; margin-top:0.5rem; font-size:0.78rem; color:#475569;">
                <a href="/" style="color:#475569;">← Back to home</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const errorMsg = document.getElementById('error-msg');
            btn.disabled = true;
            btn.textContent = 'Signing in…';
            errorMsg.style.display = 'none';

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value,
                    })
                });
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    const data = await res.json();
                    errorMsg.textContent = data.error || 'Login failed. Check your credentials.';
                    errorMsg.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                }
            } catch {
                errorMsg.textContent = 'Network error — please try again.';
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
