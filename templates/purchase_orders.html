{% extends "layout.html" %}

{% block title %}Purchase Orders - InventoryPro{% endblock %}

{% block content %}
<header class="page-header">
    <h2 class="page-title">Stock Procurement & Purchase Orders</h2>
    <div style="display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center;">
        <input type="text" id="po-search" class="form-control" placeholder="🔍 Search orders..." style="width:220px;">
        <button class="btn btn-primary" onclick="openPOModal()">+ New Purchase Order</button>
    </div>
</header>

<div class="table-container" style="overflow-x:auto;">
    <table style="min-width:700px;">
        <thead>
            <tr>
                <th>Date</th>
                <th>Supplier</th>
                <th>Product</th>
                <th>Quantity</th>
                <th>Price / Unit</th>
                <th>Type</th>
                <th>Total Bill</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="po-tbody">
            <tr><td colspan="8" class="text-center">Loading orders...</td></tr>
        </tbody>
    </table>
</div>

<!-- Simple PO Modal -->
<div id="po-modal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closePOModal()">&times;</span>
        <h2>New Stock Procurement</h2>
        <form id="po-form">
            <div class="grid-2-col">
                <div class="form-group">
                    <label>Supplier</label>
                    <select id="p-supplier" class="form-control" required></select>
                </div>
                <div class="form-group">
                    <label>Product</label>
                    <select id="p-product" class="form-control" required></select>
                </div>
            </div>
            <div class="grid-2-col">
                <div class="form-group"><label>Quantity</label><input type="number" id="p-qty" class="form-control" required></div>
                <div class="form-group"><label>Unit Cost ($)</label><input type="number" id="p-cost" class="form-control" step="0.01" required></div>
            </div>
            <div class="form-group">
                <label>Payment Method</label>
                <select id="p-pay-type" class="form-control">
                    <option value="Cash">Cash (Paid Immediately)</option>
                    <option value="Credit">Credit (Pay Later)</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Confirm Purchase</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        loadPOs();
        loadSuppliersAndProducts();
    });

    async function loadPOs() {
        const res = await fetch('/purchase-orders');
        const data = await res.json();
        const tbody = document.getElementById('po-tbody');

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center">No purchase history found.</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(po => `
            <tr>
                <td>${new Date(po.order_date).toLocaleDateString()}</td>
                <td><strong>${po.supplier_name}</strong></td>
                <td>${po.product_name}</td>
                <td>${po.quantity}</td>
                <td>$${po.cost_price.toFixed(2)}</td>
                <td><span class="badge ${po.payment_type === 'Cash' ? 'badge-primary' : 'badge-secondary'}">${po.payment_type}</span></td>
                <td><strong>$${po.total_amount.toFixed(2)}</strong></td>
                <td><span class="badge ${po.status === 'RECEIVED' ? 'badge-success' : 'badge-warning'}">${po.status}</span></td>
            </tr>
        `).join('');
    }

    async function loadSuppliersAndProducts() {
        const [suppRes, prodRes] = await Promise.all([fetch('/suppliers'), fetch('/products')]);
        const suppliers = await suppRes.json();
        const products = await prodRes.json();
        
        const suppSelect = document.getElementById('p-supplier');
        const prodSelect = document.getElementById('p-product');

        suppliers.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = s.name;
            suppSelect.appendChild(opt);
        });

        products.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.textContent = `${p.name} (SKU: ${p.sku})`;
            prodSelect.appendChild(opt);
        });
    }

    function openPOModal() { document.getElementById('po-modal').style.display = 'block'; }
    function closePOModal() { document.getElementById('po-modal').style.display = 'none'; }

    document.getElementById('po-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const poData = {
            supplier_id: parseInt(document.getElementById('p-supplier').value),
            product_id: parseInt(document.getElementById('p-product').value),
            quantity: parseInt(document.getElementById('p-qty').value),
            cost_price: parseFloat(document.getElementById('p-cost').value),
            payment_type: document.getElementById('p-pay-type').value
        };

        try {
            const res = await fetch('/purchase-orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(poData)
            });
            if (res.ok) {
                closePOModal();
                loadPOs();
                document.getElementById('po-form').reset();
            } else {
                const result = await res.json();
                alert(result.error || 'Failed to record purchase');
            }
        } catch (err) { alert('Network error'); }
    });

    document.getElementById('po-search').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const rows = document.querySelectorAll('#po-tbody tr');
        rows.forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(term) ? '' : 'none';
        });
    });
</script>
{% endblock %}
