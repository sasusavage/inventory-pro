{% extends "layout.html" %}

{% block title %}Refunds - InventoryPro{% endblock %}

{% block content %}
<header class="page-header">
    <h2 class="page-title">Returns & Refunds</h2>
    <div class="flex items-center gap-2">
        <input type="text" id="refund-search" class="form-control" placeholder="Search product or sale id..." style="width: 250px;">
    </div>
</header>

<div class="table-container" style="overflow-x:auto;">
    <table style="min-width:580px;">
        <thead>
            <tr>
                <th>Date</th>
                <th>Sale ID</th>
                <th>Product Refunded</th>
                <th>Quantity</th>
                <th>Reason</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="refunds-tbody">
            <tr><td colspan="7" class="text-center">Loading refunds...</td></tr>
        </tbody>
    </table>
</div>

<script>
    document.addEventListener('DOMContentLoaded', loadRefunds);

    async function loadRefunds() {
        const res = await fetch('/refunds');
        const refunds = await res.json();
        const tbody = document.getElementById('refunds-tbody');

        if (refunds.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center">No refund records found.</td></tr>';
            return;
        }

        tbody.innerHTML = refunds.map(r => `
            <tr>
                <td>${new Date(r.created_at).toLocaleDateString()}</td>
                <td>#${r.sale_id}</td>
                <td><strong>${r.product_name}</strong></td>
                <td>${r.quantity}</td>
                <td><small>${r.reason || 'N/A'}</small></td>
                <td><span class="badge ${r.status === 'Approved' ? 'badge-success' : 'badge-warning'}">${r.status}</span></td>
                <td>
                    <button class="btn btn-secondary btn-sm" onclick="alert('Module under development.')">View Details</button>
                    ${r.status === 'Pending' ? `<button class="btn btn-success btn-sm">Approve</button>` : ''}
                </td>
            </tr>
        `).join('');
    }

    document.getElementById('refund-search').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const rows = document.querySelectorAll('#refunds-tbody tr');
        rows.forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(term) ? '' : 'none';
        });
    });
</script>
{% endblock %}
