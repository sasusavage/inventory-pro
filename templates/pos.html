{% extends "layout.html" %}

{% block title %}POS Terminal - InventoryPro{% endblock %}

{% block content %}
<header class="page-header" style="margin-bottom: 1.5rem;">
    <h2 class="page-title">Point of Sale</h2>
    <div class="user-profile">
        <span class="user-name">Welcome, <span id="user-role-display-pos">User</span></span>
    </div>
</header>

<div class="grid-2-col" style="grid-template-columns: 3fr 2fr; gap: 1.5rem;">
    <!-- POS Area (Products) -->
    <div class="card" style="display: flex; flex-direction: column; height: 80vh;">
        <div class="form-group" style="margin-bottom: 1rem;">
            <input type="text" id="pos-search" class="form-control" placeholder="Search by name or SKU..." autocomplete="off">
        </div>
        
        <div id="pos-products" class="grid-3-col" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; overflow-y: auto; padding-right: 0.5rem;">
            <!-- Products Loaded dynamically -->
            <div class="text-center" style="grid-column: 1/-1; padding: 2rem;">Loading products...</div>
        </div>
    </div>

    <!-- Order Summary area (Invoice) -->
    <div class="card" style="display: flex; flex-direction: column; height: 80vh;">
        <div class="card-header" style="flex-shrink: 0; margin-bottom: 1rem;">
            <h3>🛒 Your Basket</h3>
            <button class="btn btn-secondary btn-sm" onclick="clearCart()">Clear</button>
        </div>
        
        <!-- Customer Selection -->
        <div class="form-group" style="flex-shrink: 0; margin-bottom: 1rem;">
            <label>👤 Select Customer</label>
            <div class="flex gap-2">
                <select id="pos-customer" class="form-control" style="flex: 1;">
                    <option value="">-- Select Customer --</option>
                </select>
            </div>
        </div>

        <div id="pos-cart" style="flex: 1; overflow-y: auto; margin-bottom: 2rem; border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); padding: 1rem 0;">
            <div class="text-center" style="padding: 2rem; color: var(--text-muted);">
                Cart is currently empty.
            </div>
        </div>

        <div class="order-summary" style="flex-shrink: 0;">
            <div class="flex justify-between" style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1rem; color: #ffffff;">
                <span>GRAND TOTAL</span>
                <span id="pos-total">$0.00</span>
            </div>
            
            <div class="form-group" style="margin-bottom: 1rem;">
                <label>💵 Amount Paid</label>
                <input type="number" id="pos-paid" class="form-control" value="0" step="0.01">
            </div>

            <button class="btn btn-primary btn-block" style="padding: 1rem; font-size: 1.1rem; border-radius: var(--radius-md);" onclick="checkout()" id="checkout-btn">
                ✅ Complete Order
            </button>
        </div>
    </div>
</div>

<script>
    let products = [];
    let cart = [];
    let customers = [];

    document.addEventListener('DOMContentLoaded', async () => {
        if (typeof checkAuthAndPerms === 'function') {
            await checkAuthAndPerms();
        }
        loadPOSProducts();
        loadPOSCustomers();

        document.getElementById('pos-search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            renderPOSProducts(products.filter(p => 
                p.name.toLowerCase().includes(term) || 
                p.sku.toLowerCase().includes(term)
            ));
        });
    });

    async function loadPOSProducts() {
        const res = await fetch('/products');
        products = await res.json();
        renderPOSProducts(products);
    }

    async function loadPOSCustomers() {
        const res = await fetch('/customers');
        customers = await res.json();
        const select = document.getElementById('pos-customer');
        customers.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = `${c.full_name} (${c.phone})`;
            select.appendChild(opt);
        });
    }

    function renderPOSProducts(pList) {
        const grid = document.getElementById('pos-products');
        if (pList.length === 0) {
            grid.innerHTML = '<div class="text-center" style="grid-column: 1/-1; padding: 2rem;">No matching items found. 🔍</div>';
            return;
        }

        grid.innerHTML = pList.map(p => {
            let img = p.image_filename ? `/static/uploads/${p.image_filename}` :
                    (p.image_url || 'https://placehold.co/50?text=No+Img');
            
            return `
                <div class="stat-card" onclick="addToCart(${p.id})" style="flex-direction: column; align-items: center; text-align: center; cursor: pointer; padding: 1rem;">
                    <img src="${img}" style="width: 100%; height: 100px; object-fit: cover; border-radius: 8px; margin-bottom: 0.5rem;">
                    <h4 style="font-size: 0.9rem; margin-bottom: 0.25rem;">${p.name}</h4>
                    <p style="font-size: 0.8rem; color: var(--text-muted);">$${p.selling_price.toFixed(2)}</p>
                    <p style="font-size: 0.7rem; color: ${p.quantity_in_stock <= p.min_stock_level ? '#fb7185' : '#34d399'}">${p.quantity_in_stock} in stock</p>
                </div>
            `;
        }).join('');
    }

    function addToCart(pId) {
        const p = products.find(x => x.id === pId);
        if (!p) return;
        if (p.quantity_in_stock <= 0) return alert('This product is currently out of stock!');

        const existing = cart.find(x => x.id === pId);
        if (existing) {
            if (existing.quantity >= p.quantity_in_stock) return alert('No more stock available!');
            existing.quantity++;
        } else {
            cart.push({ ...p, quantity: 1 });
        }
        renderCart();
    }

    function updateCartQty(pId, qty) {
        const item = cart.find(x => x.id === pId);
        const p = products.find(x => x.id === pId);
        if (qty > p.quantity_in_stock) return alert('No more stock available!');
        if (qty <= 0) {
            cart = cart.filter(x => x.id !== pId);
        } else {
            item.quantity = parseInt(qty);
        }
        renderCart();
    }

    function renderCart() {
        const container = document.getElementById('pos-cart');
        if (cart.length === 0) {
            container.innerHTML = '<div class="text-center" style="padding: 2rem; color: var(--text-muted);">Cart is currently empty.</div>';
            document.getElementById('pos-total').textContent = '$0.00';
            return;
        }

        container.innerHTML = cart.map(item => `
            <div class="list-item" style="padding: 0.75rem;">
                <div style="flex: 1;">
                    <div style="font-weight: 600;">${item.name}</div>
                    <div style="font-size: 0.8rem; color: var(--text-muted);">$${item.selling_price.toFixed(2)} / unit</div>
                </div>
                <div class="flex items-center gap-2" style="width: 150px; justify-content: flex-end;">
                    <input type="number" value="${item.quantity}" class="form-control" style="width: 60px; padding: 0.25rem 0.5rem;" 
                        onchange="updateCartQty(${item.id}, this.value)">
                    <button class="btn btn-danger btn-sm" onclick="updateCartQty(${item.id}, 0)">×</button>
                </div>
            </div>
        `).join('');

        const total = cart.reduce((sum, item) => sum + (item.selling_price * item.quantity), 0);
        document.getElementById('pos-total').textContent = `$${total.toFixed(2)}`;
        document.getElementById('pos-paid').value = total.toFixed(2);
    }

    async function checkout() {
        if (cart.length === 0) return alert('Add items to the cart first!');
        const cId = document.getElementById('pos-customer').value;
        if (!cId) return alert('Please select a customer.');

        const total = cart.reduce((sum, item) => sum + (item.selling_price * item.quantity), 0);
        const amountPaid = parseFloat(document.getElementById('pos-paid').value);

        const saleData = {
            customer_id: parseInt(cId),
            items: cart.map(item => ({ product_id: item.id, quantity: item.quantity, price: item.selling_price })),
            amount_paid: amountPaid
        };

        try {
            document.getElementById('checkout-btn').disabled = true;
            const res = await fetch('/sales', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(saleData)
            });

            const result = await res.json();
            if (!res.ok) throw new Error(result.error || 'Failed to process order');

            alert('Order processed successfully! 🎉');
            window.location.href = `/sales/${result.id}/invoice`;
        } catch (err) {
            alert(err.message);
            document.getElementById('checkout-btn').disabled = false;
        }
    }

    function clearCart() {
        if (confirm('Clear all items from basket?')) {
            cart = [];
            renderCart();
        }
    }
</script>
{% endblock %}
