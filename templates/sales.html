{% extends "layout.html" %}

{% block title %}Sales History - InventoryPro{% endblock %}

{% block content %}
<header class="page-header">
    <h2 class="page-title">Sales & History</h2>
    <div class="flex items-center gap-2" style="flex-wrap:wrap;justify-content:flex-end;">
        <input type="text" id="sales-search" class="form-control" placeholder="Search customer..." style="width:200px;">
        <select id="status-filter" class="form-control" style="width:130px;">
            <option value="">All Statuses</option>
            <option value="PAID">Paid</option>
            <option value="PARTIAL">Partial</option>
            <option value="UNPAID">Unpaid</option>
        </select>
        <input type="date" id="date-from" class="form-control" style="width:150px;" title="From date">
        <input type="date" id="date-to" class="form-control" style="width:150px;" title="To date">
        <button class="btn btn-secondary" onclick="applyFilters()">Filter</button>
        <a href="/export/sales.csv" class="btn btn-secondary">📊 Export CSV</a>
    </div>
</header>

<div class="table-container">
    <table class="table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Paid</th>
                <th>Balance</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="sales-tbody">
            <tr><td colspan="8" class="text-center">Loading sales...</td></tr>
        </tbody>
    </table>
</div>

<!-- Pagination -->
<div id="pagination-bar" class="flex items-center gap-2" style="margin-top:1rem;justify-content:center;display:none;">
    <button class="btn btn-secondary btn-sm" id="prev-btn" onclick="changePage(-1)">← Prev</button>
    <span id="page-info" style="color:var(--text-muted);font-size:0.9rem;"></span>
    <button class="btn btn-secondary btn-sm" id="next-btn" onclick="changePage(1)">Next →</button>
</div>

<script>
    let currentPage = 1;
    let totalPages = 1;

    document.addEventListener('DOMContentLoaded', () => loadSales());

    async function loadSales(page = 1) {
        currentPage = page;
        const search = document.getElementById('sales-search').value.trim();
        const status = document.getElementById('status-filter').value;
        const dateFrom = document.getElementById('date-from').value;
        const dateTo = document.getElementById('date-to').value;

        const params = new URLSearchParams({ page, per_page: 50 });
        if (search) params.set('search', search);
        if (status) params.set('status', status);
        if (dateFrom) params.set('date_from', dateFrom);
        if (dateTo) params.set('date_to', dateTo + 'T23:59:59');

        const tbody = document.getElementById('sales-tbody');
        tbody.innerHTML = '<tr><td colspan="8" class="text-center">Loading...</td></tr>';

        try {
            const res = await fetch(`/sales?${params}`);
            const json = await res.json();

            const sales = json.data || [];
            const pagination = json.pagination || {};
            totalPages = pagination.pages || 1;

            updatePaginationBar(pagination);

            if (sales.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center">No sales found.</td></tr>';
                return;
            }

            tbody.innerHTML = sales.map(s => {
                const statusClass = s.payment_status === 'PAID' ? 'badge-success'
                    : s.payment_status === 'PARTIAL' ? 'badge-warning' : 'badge-danger';
                const itemsSummary = (s.items || []).map(i => `${i.product_name} (x${i.quantity})`).join(', ') || '—';

                return `
                    <tr>
                        <td>${new Date(s.sale_date).toLocaleString()}</td>
                        <td><strong>${s.customer_name}</strong></td>
                        <td><small>${itemsSummary}</small></td>
                        <td>$${s.total_amount.toFixed(2)}</td>
                        <td>$${s.amount_paid.toFixed(2)}</td>
                        <td class="${s.balance_due > 0 ? 'text-danger' : 'text-success'}">$${s.balance_due.toFixed(2)}</td>
                        <td><span class="badge ${statusClass}">${s.payment_status}</span></td>
                        <td>
                            <a href="/sales/${s.id}/invoice" class="btn btn-secondary btn-sm" target="_blank">📄 Receipt</a>
                        </td>
                    </tr>`;
            }).join('');
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center text-danger">Error loading sales</td></tr>';
        }
    }

    function updatePaginationBar(pagination) {
        const bar = document.getElementById('pagination-bar');
        if (!pagination.total || pagination.pages <= 1) { bar.style.display = 'none'; return; }
        bar.style.display = 'flex';
        document.getElementById('page-info').textContent =
            `Page ${pagination.page} of ${pagination.pages} (${pagination.total} records)`;
        document.getElementById('prev-btn').disabled = pagination.page <= 1;
        document.getElementById('next-btn').disabled = pagination.page >= pagination.pages;
    }

    function changePage(dir) {
        const next = currentPage + dir;
        if (next < 1 || next > totalPages) return;
        loadSales(next);
    }

    function applyFilters() { loadSales(1); }

    // Trigger filter on Enter in search box
    document.getElementById('sales-search').addEventListener('keydown', e => {
        if (e.key === 'Enter') applyFilters();
    });
</script>
{% endblock %}
