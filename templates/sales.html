{% extends "layout.html" %}

{% block title %}Sales History - InventoryPro{% endblock %}

{% block content %}
<header class="page-header">
    <h2 class="page-title">Sales Inventory & History</h2>
    <div class="flex items-center gap-2">
        <input type="text" id="sales-search" class="form-control" placeholder="Search sales..." style="width: 250px;">
        <button class="btn btn-secondary" onclick="exportCSV()">📊 Export CSV</button>
    </div>
</header>

<div class="table-container">
    <table class="table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Customer</th>
                <th>Items (Qty)</th>
                <th>Total</th>
                <th>Paid</th>
                <th>Balance</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="sales-tbody">
            <tr><td colspan="8" class="text-center">Loading sales...</td></tr>
        </tbody>
    </table>
</div>

<script>
    document.addEventListener('DOMContentLoaded', loadSales);

    async function loadSales() {
        const res = await fetch('/sales');
        const sales = await res.json();
        const tbody = document.getElementById('sales-tbody');

        if (sales.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center">No sales history yet.</td></tr>';
            return;
        }

        tbody.innerHTML = sales.map(s => {
            const statusClass = s.payment_status === 'PAID' ? 'badge-success' : (s.payment_status === 'PARTIAL' ? 'badge-warning' : 'badge-danger');
            const itemsSummary = s.items.map(item => `${item.product_name} (x${item.quantity})`).join(', ');
            
            return `
                <tr>
                    <td>${new Date(s.sale_date).toLocaleString()}</td>
                    <td><strong>${s.customer_name}</strong></td>
                    <td><small>${itemsSummary}</small></td>
                    <td>$${s.total_amount.toFixed(2)}</td>
                    <td>$${s.amount_paid.toFixed(2)}</td>
                    <td class="${s.balance_due > 0 ? 'text-danger' : 'text-success'}">$${s.balance_due.toFixed(2)}</td>
                    <td><span class="badge ${statusClass}">${s.payment_status}</span></td>
                    <td>
                        <div class="flex gap-2">
                            <a href="/sales/${s.id}/invoice" class="btn btn-secondary btn-sm" target="_blank">📄 Receipt</a>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }

    document.getElementById('sales-search').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const rows = document.querySelectorAll('#sales-tbody tr');
        rows.forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(term) ? '' : 'none';
        });
    });

    function exportCSV() {
        // Simple CSV export logic
        let csv = 'Date,Customer,Total,Paid,Balance,Status\n';
        document.querySelectorAll('#sales-tbody tr').forEach(row => {
            const cells = row.querySelectorAll('td');
            if (cells.length > 0) {
                csv += Array.from(cells).slice(0, 7).map(c => c.innerText.replace(/,/g, '')).join(',') + '\n';
            }
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'sales_report.csv';
        a.click();
    }
</script>
{% endblock %}
