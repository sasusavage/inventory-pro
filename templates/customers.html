{% extends "layout.html" %}

{% block title %}Customers - InventoryPro{% endblock %}

{% block content %}
<header class="page-header">
    <h2 class="page-title">Customer Relationship Management</h2>
    <div class="flex items-center gap-2">
        <input type="text" id="cust-search" class="form-control" placeholder="Search customers..." style="width: 250px;">
        <button class="btn btn-primary" onclick="openCustModal()">+ Add Customer</button>
    </div>
</header>

<div class="table-container">
    <table class="table">
        <thead>
            <tr>
                <th>Customer Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Address</th>
                <th>Outstanding Debt</th>
                <th>Join Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="cust-tbody">
            <tr><td colspan="7" class="text-center">Loading customers...</td></tr>
        </tbody>
    </table>
</div>

<div id="cust-modal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeCustModal()">&times;</span>
        <h2>Add New Customer</h2>
        <form id="cust-form">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="c-name" class="form-control" required>
            </div>
            <div class="grid-2-col">
                <div class="form-group"><label>Phone Number</label><input type="text" id="c-phone" class="form-control" required></div>
                <div class="form-group"><label>Email (Optional)</label><input type="email" id="c-email" class="form-control"></div>
            </div>
            <div class="form-group">
                <label>Physical Address</label>
                <textarea id="c-address" class="form-control" style="width: 100%; min-height: 80px;"></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Register Customer</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', loadCustomers);

    async function loadCustomers() {
        const res = await fetch('/customers');
        const data = await res.json();
        const tbody = document.getElementById('cust-tbody');

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center">No customers yet.</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(c => `
            <tr>
                <td><strong>${c.full_name}</strong></td>
                <td>${c.phone}</td>
                <td>${c.email || 'N/A'}</td>
                <td><small>${c.address || 'N/A'}</small></td>
                <td class="${c.total_debt > 0 ? 'text-danger' : 'text-success'}"><strong>$${(c.total_debt || 0).toFixed(2)}</strong></td>
                <td>${new Date(c.created_at).toLocaleDateString()}</td>
                <td>
                    <button class="btn btn-secondary btn-sm">Edit</button>
                </td>
            </tr>
        `).join('');
    }

    function openCustModal() { document.getElementById('cust-modal').style.display = 'block'; }
    function closeCustModal() { document.getElementById('cust-modal').style.display = 'none'; }

    document.getElementById('cust-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const cData = {
            full_name: document.getElementById('c-name').value,
            phone: document.getElementById('c-phone').value,
            email: document.getElementById('c-email').value || null,
            address: document.getElementById('c-address').value || null
        };

        try {
            const res = await fetch('/customers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(cData)
            });
            if (res.ok) {
                closeCustModal();
                loadCustomers();
                document.getElementById('cust-form').reset();
            } else {
                const result = await res.json();
                alert(result.error || 'Failed to add customer');
            }
        } catch (err) { alert('Network error'); }
    });

    document.getElementById('cust-search').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const rows = document.querySelectorAll('#cust-tbody tr');
        rows.forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(term) ? '' : 'none';
        });
    });
</script>
{% endblock %}
