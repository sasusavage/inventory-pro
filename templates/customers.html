{% extends "layout.html" %}
{% block title %}Customers - InventoryPro{% endblock %}

{% block content %}
<header class="page-header">
    <h2 class="page-title">Customers</h2>
    <div style="display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center;">
        <input type="text" id="cust-search" class="form-control" placeholder="🔍 Search…" style="width:190px;">
        <a href="/export/customers.csv" class="btn btn-secondary btn-sm">📊 CSV</a>
        <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ Add</button>
    </div>
</header>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Debt</th>
                <th>Joined</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="cust-tbody">
            <tr><td colspan="6" class="text-center" style="padding:2rem; color:var(--text-muted);">Loading…</td></tr>
        </tbody>
    </table>
</div>

<div id="pagination-bar" class="pagination" style="display:none;">
    <button id="prev-btn" onclick="changePage(-1)" disabled>← Prev</button>
    <span id="page-info" style="font-size:0.82rem; color:var(--text-muted); padding:0 0.5rem;"></span>
    <button id="next-btn" onclick="changePage(1)">Next →</button>
</div>

<!-- Add / Edit Modal -->
<div id="cust-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="cust-modal-title" style="font-size:1.1rem; font-weight:700; margin:0;">Add Customer</h2>
            <button class="close-modal" onclick="closeCustModal()">&times;</button>
        </div>
        <form id="cust-form">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="c-name" class="form-control" required>
            </div>
            <div class="grid-2-col">
                <div class="form-group">
                    <label>Phone *</label>
                    <input type="tel" id="c-phone" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="c-email" class="form-control">
                </div>
            </div>
            <div class="form-group">
                <label>Address</label>
                <textarea id="c-address" class="form-control" rows="2"></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Save Customer</button>
        </form>
    </div>
</div>

<!-- Pay Balance Modal -->
<div id="pay-modal" class="modal">
    <div class="modal-content" style="max-width:620px;">
        <div class="modal-header">
            <h2 style="font-size:1.1rem; font-weight:700; margin:0;">
                💳 Pay Balance — <span id="pay-customer-name"></span>
            </h2>
            <button class="close-modal" onclick="closePayModal()">&times;</button>
        </div>
        <p style="color:var(--text-muted); font-size:0.88rem; margin-bottom:1rem;">
            Outstanding: <strong id="pay-total-outstanding" class="text-danger"></strong>
        </p>
        <div id="pay-sales-list"
             style="display:flex; flex-direction:column; gap:0.75rem; max-height:55vh; overflow-y:auto; padding-right:2px;"></div>
        <p id="pay-msg" style="font-size:0.85rem; min-height:1.2em; margin-top:0.75rem;"></p>
    </div>
</div>

<script>
let currentPage = 1, totalPages = 1;

document.addEventListener('DOMContentLoaded', () => {
    loadCustomers();
    let t;
    document.getElementById('cust-search').addEventListener('input', () => {
        clearTimeout(t);
        t = setTimeout(() => loadCustomers(1), 300);
    });
    document.getElementById('cust-form').addEventListener('submit', saveCustomer);
});

async function loadCustomers(page = 1) {
    currentPage = page;
    const search = document.getElementById('cust-search').value.trim();
    const params = new URLSearchParams({ page, per_page: 50 });
    if (search) params.set('search', search);

    const tbody = document.getElementById('cust-tbody');
    tbody.innerHTML = '<tr><td colspan="6" class="text-center" style="padding:1.5rem; color:var(--text-muted);">Loading…</td></tr>';

    try {
        const json = await fetch(`/customers?${params}`).then(r => r.json());
        const data = json.data || json;
        const pg   = json.pagination || {};
        totalPages = pg.pages || 1;
        renderPagination(pg);

        if (!data.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center" style="padding:2rem; color:var(--text-muted);">No customers found.</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(c => {
            const debt = c.total_debt || 0;
            const debtCell = debt > 0
                ? `<div style="display:flex; align-items:center; gap:0.4rem; flex-wrap:wrap;">
                     <strong class="text-danger">$${debt.toFixed(2)}</strong>
                     <button class="btn btn-warning btn-sm" onclick="openPayModal(${c.id},'${escHtml(c.full_name)}')">💳 Pay</button>
                   </div>`
                : `<span class="text-success">$0.00</span>`;
            return `
            <tr>
                <td><strong>${escHtml(c.full_name)}</strong></td>
                <td><a href="tel:${escHtml(c.phone)}" style="color:var(--accent-primary);">${escHtml(c.phone)}</a></td>
                <td style="color:var(--text-muted); font-size:0.82rem;">${escHtml(c.email || '—')}</td>
                <td>${debtCell}</td>
                <td style="color:var(--text-muted); font-size:0.8rem; white-space:nowrap;">${new Date(c.created_at).toLocaleDateString()}</td>
                <td style="white-space:nowrap;">
                    <button class="btn btn-secondary btn-sm" onclick='openEditModal(${JSON.stringify(c)})'>Edit</button>
                    <a href="/customers/${c.id}/statement" target="_blank" class="btn btn-secondary btn-sm" title="Statement of Account">📄</a>
                </td>
            </tr>`;
        }).join('');
    } catch {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger">Error loading customers</td></tr>';
    }
}

function renderPagination(pg) {
    const bar = document.getElementById('pagination-bar');
    if (!pg.total || pg.pages <= 1) { bar.style.display = 'none'; return; }
    bar.style.display = 'flex';
    document.getElementById('page-info').textContent = `Page ${pg.page} of ${pg.pages} (${pg.total} total)`;
    document.getElementById('prev-btn').disabled = pg.page <= 1;
    document.getElementById('next-btn').disabled = pg.page >= pg.pages;
}

function changePage(dir) {
    const next = currentPage + dir;
    if (next < 1 || next > totalPages) return;
    loadCustomers(next);
}

function openAddModal() {
    document.getElementById('cust-modal-title').textContent = 'Add Customer';
    document.getElementById('cust-form').reset();
    document.getElementById('cust-form').dataset.editId = '';
    document.getElementById('cust-modal').classList.add('active');
}

function openEditModal(c) {
    document.getElementById('cust-modal-title').textContent = 'Edit Customer';
    document.getElementById('c-name').value    = c.full_name;
    document.getElementById('c-phone').value   = c.phone;
    document.getElementById('c-email').value   = c.email || '';
    document.getElementById('c-address').value = c.address || '';
    document.getElementById('cust-form').dataset.editId = c.id;
    document.getElementById('cust-modal').classList.add('active');
}

function closeCustModal() { document.getElementById('cust-modal').classList.remove('active'); }

async function saveCustomer(e) {
    e.preventDefault();
    const editId = e.target.dataset.editId;
    const body   = {
        full_name: document.getElementById('c-name').value,
        phone:     document.getElementById('c-phone').value,
        email:     document.getElementById('c-email').value || null,
        address:   document.getElementById('c-address').value || null,
    };
    const res = await fetch(editId ? `/customers/${editId}` : '/customers', {
        method: editId ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
    });
    const result = await res.json();
    if (res.ok) {
        window.showToastNotification(editId ? 'Customer updated!' : 'Customer added!');
        closeCustModal();
        loadCustomers(currentPage);
    } else {
        window.showToastNotification(result.error || 'Failed to save', 'error');
    }
}

/* Pay Balance Modal */
async function openPayModal(customerId, customerName) {
    document.getElementById('pay-customer-name').textContent = customerName;
    document.getElementById('pay-msg').textContent = '';
    document.getElementById('pay-sales-list').dataset.customerId = customerId;
    document.getElementById('pay-sales-list').innerHTML =
        '<p style="color:var(--text-muted); padding:0.5rem;">Loading outstanding sales…</p>';
    document.getElementById('pay-modal').classList.add('active');

    try {
        const res  = await fetch(`/customers/${customerId}/outstanding-sales`);
        const data = await res.json();
        document.getElementById('pay-total-outstanding').textContent = `$${data.total_outstanding.toFixed(2)}`;

        if (!data.sales.length) {
            document.getElementById('pay-sales-list').innerHTML =
                '<p class="text-success" style="padding:0.5rem;">No outstanding balances — all paid! ✅</p>';
            return;
        }

        document.getElementById('pay-sales-list').innerHTML = data.sales.map(s => `
            <div style="background:var(--bg-elevated); border:1px solid var(--border-subtle);
                        border-radius:var(--radius-md); padding:0.9rem;">
                <div style="display:flex; justify-content:space-between; align-items:center;
                            flex-wrap:wrap; gap:0.4rem; margin-bottom:0.4rem;">
                    <span style="font-size:0.82rem; color:var(--text-muted);">Sale #${s.id} · ${s.sale_date}</span>
                    <span class="badge ${s.payment_status === 'PARTIAL' ? 'badge-warning' : 'badge-danger'}">${s.payment_status}</span>
                </div>
                <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:0.5rem;">${escHtml(s.items_summary || '—')}</p>
                <div style="display:flex; gap:1rem; font-size:0.85rem; flex-wrap:wrap; margin-bottom:0.65rem;">
                    <span>Total: <strong>$${s.total_amount.toFixed(2)}</strong></span>
                    <span>Paid: <strong class="text-success">$${s.amount_paid.toFixed(2)}</strong></span>
                    <span>Balance: <strong class="text-danger">$${s.balance_due.toFixed(2)}</strong></span>
                </div>
                <div style="display:flex; gap:0.4rem; flex-wrap:wrap; align-items:center;">
                    <input type="number" id="pay-amt-${s.id}" class="form-control"
                           placeholder="Amount" step="0.01" min="0.01" max="${s.balance_due}"
                           style="max-width:150px;">
                    <button class="btn btn-primary btn-sm"
                            onclick="submitPayment(${s.id}, ${s.balance_due})">Pay Amount</button>
                    <button class="btn btn-secondary btn-sm"
                            onclick="submitPayment(${s.id}, ${s.balance_due}, true)">
                        Pay Full ($${s.balance_due.toFixed(2)})
                    </button>
                </div>
                <p id="pay-sale-msg-${s.id}" style="font-size:0.8rem; min-height:1em; margin-top:0.35rem;"></p>
            </div>`).join('');
    } catch {
        document.getElementById('pay-sales-list').innerHTML =
            '<p class="text-danger">Failed to load outstanding sales.</p>';
    }
}

async function submitPayment(saleId, balanceDue, payFull = false) {
    const input  = document.getElementById(`pay-amt-${saleId}`);
    const msgEl  = document.getElementById(`pay-sale-msg-${saleId}`);
    const amount = payFull ? balanceDue : parseFloat(input.value);
    if (!amount || amount <= 0)          { msgEl.textContent = 'Enter a valid amount.'; return; }
    if (amount > balanceDue + 0.001)     { msgEl.textContent = `Max $${balanceDue.toFixed(2)}`; return; }
    msgEl.textContent = 'Processing…';
    try {
        const res    = await fetch(`/sales/${saleId}/payment`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ additional_payment: amount }),
        });
        const result = await res.json();
        if (res.ok) {
            msgEl.style.color = '#059669';
            msgEl.textContent = `✓ $${amount.toFixed(2)} recorded. Balance: $${result.new_balance.toFixed(2)}`;
            input.value = '';
            setTimeout(() => {
                const cid = document.getElementById('pay-sales-list').dataset.customerId;
                if (cid) openPayModal(cid, document.getElementById('pay-customer-name').textContent);
                loadCustomers(currentPage);
            }, 1200);
        } else {
            msgEl.style.color = '#dc2626';
            msgEl.textContent = result.error || 'Payment failed.';
        }
    } catch {
        msgEl.style.color = '#dc2626';
        msgEl.textContent = 'Network error.';
    }
}

function closePayModal() { document.getElementById('pay-modal').classList.remove('active'); }

function escHtml(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
{% endblock %}
