{% extends "layout.html" %}

{% block title %}Suppliers - InventoryPro{% endblock %}

{% block content %}
<header class="page-header">
    <h2 class="page-title">Supplier Management</h2>
    <div style="display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center;">
        <input type="text" id="supp-search" class="form-control" placeholder="🔍 Search suppliers..." style="width:220px;">
        <button class="btn btn-primary" onclick="openSuppModal()">+ Add Supplier</button>
    </div>
</header>

<div class="table-container" style="overflow-x:auto;">
    <table style="min-width:500px;">
        <thead>
            <tr>
                <th>Supplier Name</th>
                <th>Phone Number</th>
                <th>Total Paid</th>
                <th>Created At</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="supp-tbody">
            <tr><td colspan="5" class="text-center">Loading suppliers...</td></tr>
        </tbody>
    </table>
</div>

<div id="supp-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 style="font-size:1.1rem;font-weight:700;margin:0;">Add Registered Supplier</h2>
            <button class="close-modal" onclick="closeSuppModal()">&times;</button>
        </div>
        <form id="supp-form">
            <div class="form-group">
                <label>Company Name</label>
                <input type="text" id="s-name" class="form-control" placeholder="e.g., Tech Distribution Ltd." required>
            </div>
            <div class="form-group">
                <label>Official Phone Number</label>
                <input type="text" id="s-phone" class="form-control" placeholder="e.g., +1 234 567 890" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Add Supplier</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', loadSuppliers);

    async function loadSuppliers() {
        const res = await fetch('/suppliers');
        const data = await res.json();
        const tbody = document.getElementById('supp-tbody');

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center">No suppliers registered.</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(s => `
            <tr>
                <td><strong>${s.name}</strong></td>
                <td>${s.phone}</td>
                <td>$${(s.total_paid || 0).toFixed(2)}</td>
                <td>${new Date(s.created_at).toLocaleDateString()}</td>
                <td>
                    <button class="btn btn-secondary btn-sm" onclick="paySupplierModal(${s.id}, '${s.name}')">💸 Register Payment</button>
                </td>
            </tr>
        `).join('');
    }

    function openSuppModal() { document.getElementById('supp-modal').classList.add('active'); }
    function closeSuppModal() { document.getElementById('supp-modal').classList.remove('active'); }

    document.getElementById('supp-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const sData = {
            name: document.getElementById('s-name').value,
            phone: document.getElementById('s-phone').value
        };

        try {
            const res = await fetch('/suppliers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(sData)
            });
            if (res.ok) {
                closeSuppModal();
                loadSuppliers();
                document.getElementById('supp-form').reset();
            } else {
                const result = await res.json();
                alert(result.error || 'Failed to add supplier');
            }
        } catch (err) { alert('Network error'); }
    });

    document.getElementById('supp-search').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const rows = document.querySelectorAll('#supp-tbody tr');
        rows.forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(term) ? '' : 'none';
        });
    });
</script>
{% endblock %}
